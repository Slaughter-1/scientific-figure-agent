[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-figure-agent"
version = "0.1.0"
description = "Evidence-traceable scientific figure generation for LLM, NLP, and agent papers"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.10"]

[project.optional-dependencies]
test = ["pytest>=9.0"]
web = ["fastapi>=0.115", "python-multipart>=0.0.9", "uvicorn>=0.30"]

[project.scripts]
figure-agent = "figure_agent.cli:main"
figure-agent-web = "figure_agent.web:main"

[tool.setuptools.packages.find]
where = ["src"]
